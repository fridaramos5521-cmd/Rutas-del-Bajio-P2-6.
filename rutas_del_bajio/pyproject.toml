[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "rutas-bajio-p2"
version = "0.1.0"
description = "Proyecto academico de logistica con persistencia CSV"
requires-python = ">=3.10"
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["rutas_bajio*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
